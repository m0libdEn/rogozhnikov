<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <title>CalmFruit</title>
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="header__logo">CALMFRUIT</a>
            <input type="text" class="header__search" placeholder="Найти на СпокойныйФрукт" id="search">
            <a class="header__cart" href="/cart.html">
               <div id="cartLogo" class="header__cart-wrapper">
                    <img src="./img/logos/cart.svg" alt="cart" class="header__cart-logo">
                    <p class="header__cart-counter" id="counter"></p>
               </div>
               <p class="header__title">Корзина</p>
            </a>
        </div>
    </header>
    <main>
        <div class="container swiper__container">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                  <div class="swiper-slide"><img src="/img/swipe1.webp" alt="swipe1" srcset=""></div>
                  <div class="swiper-slide"><img src="/img/swipe2.webp" alt="swipe1" srcset=""></div>
                  <div class="swiper-slide"><img src="/img/swipe3.webp" alt="/swipe3" srcset=""></div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
        </div>
        </div>
        <div id="list" class="list container">
        </div>
        <div id="popup1" class="popup">
            
        </div>
    </main>
</body>
<script src="./javascript/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", {
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</html>
